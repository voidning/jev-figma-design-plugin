<title id="title">Jev 判断，代码调用 API</title><desc id="desc">从左到右：在这里加一个圆，同时分给操作、形状、位置三个 Jev 节点；代码汇总校验后调用 Figma API 创建圆，设置尺寸和坐标，显示画布结果。其他判断节点省略。</desc>
